<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ЧТТ — чингэлэг сканнер</title>
<style>
  :root { --g:#16A34A; --y:#F59E0B; --bg:#0B1220; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:#F8FAFC; font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #wrap { position:fixed; inset:0; }
  video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #ov { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .top { position:absolute; top:0; left:0; right:0; padding:12px 14px calc(12px + env(safe-area-inset-top)); display:flex; gap:10px; align-items:center; background:linear-gradient(#000a, #0000); }
  .top b { font-size:17px; flex:1; }
  .btn { border:0; border-radius:12px; padding:12px 16px; font:700 16px system-ui,sans-serif; cursor:pointer; }
  .ghost { background:#ffffff22; color:#fff; }
  #msg { position:absolute; left:0; right:0; text-align:center; font-weight:600; text-shadow:0 1px 4px #000; }
  .bottom { position:absolute; left:0; right:0; bottom:0; padding:12px 14px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(#0000, #000c 30%); }
  #found { display:none; background:#fff; color:#111; border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:0 8px 30px #0008; }
  #found .code { font:800 30px ui-monospace,Menlo,Consolas,monospace; letter-spacing:.04em; text-align:center; }
  #found .code span { color:var(--g); }
  #found .q { text-align:center; color:#374151; margin:4px 0 12px; }
  #found .row { display:flex; gap:10px; } #found .row .btn { flex:1; font-size:19px; padding:16px; }
  .ok { background:var(--g); color:#fff; } .no { background:#E5E7EB; color:#111; }
  #list { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .chip { background:#ffffff1f; border:1px solid #ffffff44; border-radius:10px; padding:6px 10px; font:700 15px ui-monospace,Menlo,Consolas,monospace; display:flex; gap:8px; align-items:center; }
  .chip button { background:none; border:0; color:#fca5a5; font-size:16px; cursor:pointer; }
  #done { width:100%; font-size:19px; padding:16px; background:var(--y); color:#111; }
  #done:disabled { background:#475569; color:#cbd5e1; }
  #manual { width:100%; margin-top:8px; }
  #found .note { text-align:center; font-size:13px; color:#B45309; margin-top:-6px; margin-bottom:10px; }
  #zoom { display:flex; gap:8px; justify-content:center; margin-bottom:10px; }
  #zoom button { min-width:56px; padding:10px 12px; border-radius:999px; border:0; background:#ffffff26; color:#fff; font:700 16px system-ui,sans-serif; }
  #zoom button.on { background:#F59E0B; color:#111; }
  video { transform-origin:50% 50%; }
  #err { position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:24px; text-align:center; background:var(--bg); }
</style>
</head>
<body>
<div id="wrap">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="ov"></canvas>
  <div class="top"><b>Чингэлгийн дугаар уншуулах <span id="cnt"></span></b><button class="btn ghost" id="torch" hidden>🔦</button><button class="btn ghost" id="close">✕</button></div>
  <div id="msg">Камер асааж байна…</div>
  <div class="bottom">
    <div id="found"><div class="code" id="fcode"></div><div class="q">Энэ дугаар зөв үү?</div><div class="note" id="fnote"></div>
      <div class="row"><button class="btn no" id="fno">✗ Үгүй</button><button class="btn ok" id="fok">✓ Зөв</button></div></div>
    <div id="zoom"><button data-z="1" class="on">1×</button><button data-z="1.5">1.5×</button><button data-z="2">2×</button><button data-z="3">3×</button></div>
    <div id="list"></div>
    <button class="btn" id="done" disabled>Вэб рүү илгээх</button>
    <button class="btn ghost" id="manual">Дугаараа гараар бичих</button>
  </div>
  <div id="err"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search), MAX = Math.max(1, Math.min(4, +(qs.get('n') || 4)));

  var v = $('v'), ov = $('ov'), ctx = ov.getContext('2d'), work = document.createElement('canvas');
  var picked = [], rejected = {}, pending = null, busy = false, ocr = null, stream = null;
  var isoOk = TTOCR.isoOk;
  /* томруулах: утас дэмжвэл камерын бодит zoom, үгүй бол дэлгэц дээр томруулна (хоёр хуруугаар чимхэж ч болно) */

    ZD = ZOOM / hw; v.style.transform = ZD > 1.001 ? 'scale(' + ZD + ')' : '';
    document.querySelectorAll('#zoom button').forEach(function (b) { b.classList.toggle('on', Math.abs(+b.dataset.z - ZOOM) < 0.05); });
  }
  document.querySelectorAll('#zoom button').forEach(function (b) { b.onclick = function () { setZoom(+b.dataset.z); }; });
  var pinch = null, dist = function (t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); };
  document.addEventListener('touchstart', function (e) { if (e.touches.length === 2) pinch = { d: dist(e.touches), z: ZOOM }; }, { passive: true });
  document.addEventListener('touchmove', function (e) { if (pinch && e.touches.length === 2) { setZoom(pinch.z * dist(e.touches) / pinch.d); e.preventDefault(); } }, { passive: false });
  document.addEventListener('touchend', function (e) { if (e.touches.length < 2) pinch = null; });
  /* вэбээс ирэх чингэлгийн жагсаалт (талбайд байгаа нь эхэнд) */
  var KNOWN = [], GRP = {}; try { KNOWN = JSON.parse(localStorage.getItem('tt_known') || '[]'); } catch (e) { }
  var setGrp = function (arr) { GRP = {}; (arr || []).forEach(function (s) { var g = String(s).split(' '); g.forEach(function (c) { if (!GRP[c]) GRP[c] = g; }); }); };   // эхнийх нь давамгайлна (талбайн жагсаалт)
  try { setGrp(JSON.parse(localStorage.getItem('tt_grp') || '[]')); } catch (e) { }

        var alt = KNOWN.filter(function (k) { return k.substr(4, 6) === c.substr(4, 6) && ok(k); });
        if (alt.length === 1) return { code: alt[0], note: 'Жагсаалтаас тааруулав' };
      }
      return { code: c, note: inList || !KNOWN.length ? '' : '⚠ Манай жагсаалтад байхгүй дугаар' };

  function crop() {

  function showFound(note) {

  }
  function render() {
    $('cnt').textContent = picked.length + '/' + MAX;
    $('list').innerHTML = picked.map(function (c, i) { return '<span class="chip">' + c + '<button data-i="' + i + '">✕</button></span>'; }).join('');

    $('done').disabled = !picked.length; $('done').textContent = picked.length ? 'Вэб рүү илгээх (' + picked.length + ')' : 'Вэб рүү илгээх';
  }
  $('fok').onclick = function () {
    var c0 = pending; picked.push(c0); KNOWN.indexOf(c0) < 0 && KNOWN.push(c0); pending = null; $('found').style.display = 'none';
    // нэг машинаар хамт явдаг багцын бусдыг шууд нэмнэ
    var add = 0; (GRP[c0] || []).forEach(function (c) { if (picked.length < MAX && picked.indexOf(c) < 0) { picked.push(c); add++; } });
    render();
    if (picked.length >= MAX) { draw('#16A34A', (add ? 'Багцаар ' + picked.length + ' чингэлэг — ' : '') + 'вэб рүү илгээж байна…'); setTimeout(send, 900); }
  };
  $('fno').onclick = function () { rejected[pending] = 1; setTimeout(function (c) { delete rejected[c]; }, 4000, pending); pending = null; $('found').style.display = 'none'; };
  $('manual').onclick = function () {
    var c = (prompt('Чингэлгийн дугаар (жиш. CICU3534290)') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!c) return; if (!isoOk(c) && !confirm(c + ' — шалгах орон таарахгүй байна. Тэгсэн ч нэмэх үү?')) return;
    if (picked.indexOf(c) < 0 && picked.length < MAX) picked.push(c); render();
  };
  function send() {
    var data = { type: 'tt-scan', codes: picked.slice() };
    try { if (window.opener) { window.opener.postMessage(data, '*'); stop(); window.close(); return; } } catch (e) { }
    // нээсэн цонх олдохгүй бол: хуулах
    var txt = picked.join(' ');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { alert('Дугаарууд хуулагдлаа: ' + txt + '\nВэб дээрх чингэлгийн нүдэнд буулгана уу.'); }, function () { prompt('Эдгээрийг хуулна уу:', txt); });
  }
  $('done').onclick = send;
  $('close').onclick = function () { stop(); window.close(); };
  function stop() { try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { } }

  // камер + OCR
  function fail(t) { $('err').style.display = 'flex'; $('err').innerHTML = '<div><h2>Камер нээгдсэнгүй</h2><p>' + t + '</p><p>Хөтчийн тохиргоонд энэ сайтад камерын эрх (Allow) олгоно уу.</p></div>'; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) fail('Энэ хөтөч камер дэмжихгүй байна.');
  else navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }).then(function (s) {
    stream = s; v.srcObject = s; v.play();
    var tr = s.getVideoTracks()[0], caps = tr.getCapabilities ? tr.getCapabilities() : {};
    track = tr; if (caps.zoom && caps.zoom.max > 1) zcap = caps.zoom;
    if (caps.torch) { $('torch').hidden = false; var on = false; $('torch').onclick = function () { on = !on; tr.applyConstraints({ advanced: [{ torch: on }] }); }; }
    if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () { });
    draw('#ffffffcc', 'Унших програм ачаалж байна… (анх удаа 15–30 сек, дараа нь шууд)');
    var CDN = 'https://cdn.jsdelivr.net/npm/@gutenye/ocr-models@1.4.2/assets/', M = LOCAL ? './m/' : CDN;
    ort.env.wasm.numThreads = 1; ort.env.wasm.wasmPaths = LOCAL ? './ortw/' : 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
    var get1 = function (u, t) { return fetch(u, { cache: 'force-cache' }).then(function (r) { if (!r.ok) throw new Error(u + ' ' + r.status); return t ? r.text() : r.arrayBuffer(); }).then(function (x) { return t ? x : new Uint8Array(x); }); };
    var get = function (f, t) { return get1(M + f, t).catch(function () { return get1('./' + f, t); }); }; // CDN ажиллахгүй бол GitHub дээрх хуулбар
    return Promise.all([get('ch_PP-OCRv4_det_infer.onnx'), get('ch_PP-OCRv4_rec_infer.onnx'), get('ppocr_keys_v1.txt', 1)]).then(function (a) {
      var o = TTOCR.make(ort, a[0], a[1], a[2]); return o.ready.then(function () { ocr = o; render(); loop(); });
    });
  }).catch(function (e) { fail(e && e.message || String(e)); });
  render();
})();
